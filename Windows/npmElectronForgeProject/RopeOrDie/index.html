<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Rope & Fly - Endless Web-Slinger</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    #ui {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    .score-container {
      color: #fff;
      font-size: 28px;
      font-weight: 800;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8), 0 0 12px rgba(255,255,255,0.5);
      letter-spacing: 1px;
    }
    .score-container span {
      color: #ffffff;
      text-decoration: underline;
    }
    #game-over {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10, 10, 15, 0.95);
      border: 2px solid #ffffff;
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
      padding: 30px 40px;
      border-radius: 16px;
      text-align: center;
      color: #fff;
      display: none;
      pointer-events: auto;
      backdrop-filter: blur(8px);
    }
    #game-over h1 {
      font-size: 36px;
      color: #ffffff;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    #game-over p {
      font-size: 18px;
      margin-bottom: 25px;
      color: #ccc;
    }
    #restart-btn {
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 14px 32px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.3);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    #restart-btn:active {
      transform: scale(0.95);
      box-shadow: 0 2px 8px rgba(255, 255, 255, 0.2);
    }
    #instructions {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.8);
      font-size: 16px;
      font-weight: 600;
      text-align: center;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 8px 16px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }
  </style>
  <script src="three.min.js"></script>
  <script src="cannon.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="ui">
    <div class="score-container">DISTANCE: <span id="score">0</span>m</div>
    <div id="instructions">TAP DIRECTLY ON A BUILDING TO HOOK WEB / TAP ANYWHERE TO DETACH</div>
    <div id="game-over">
      <h1>Wasted</h1>
      <p>You hit the street! Distance: <span id="final-score">0</span>m</p>
      <button id="restart-btn">SWING AGAIN</button>
    </div>
  </div>

  <script>
    // --- GAME ENGINE & SETUP ---
    const container = document.getElementById('canvas-container');
    const scoreEl = document.getElementById('score');
    const finalScoreEl = document.getElementById('final-score');
    const gameOverEl = document.getElementById('game-over');
    const instructionsEl = document.getElementById('instructions');
    const restartBtn = document.getElementById('restart-btn');

    let scene, camera, renderer;
    let world; // Cannon.js physics world
    
    // Game State
    let isGameOver = false;
    let distance = 0;
    let buildings = [];
    let clouds = [];
    let mountains = [];
    let webGroup = null;
    let webCoreMesh = null;
    let webOutlineMesh = null;
    let activeConstraint = null;
    let anchorBody = null;
    let webAnchorMesh = null;

    // Hero Physics & Meshes
    let heroGroup;
    let heroBody;
    let heroLimbs = [];
    let limbBodies = [];
    let isAttached = false;
    let legSwingAngle = 0;

    // Materials
    let redMat, blueMat;

    // --- INITIALIZATION ---
    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a0b2e);
      scene.fog = new THREE.FogExp2(0x1a0b2e, 0.008);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // Cannon.js World Setup
      world = new CANNON.World();
      world.gravity.set(0, -28, 0);
      world.broadphase = new CANNON.NaiveBroadphase();
      world.solver.iterations = 20;

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffd59e, 1.2);
      dirLight.position.set(50, 100, 50);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      dirLight.shadow.camera.near = 0.5;
      dirLight.shadow.camera.far = 300;
      dirLight.shadow.camera.left = -50;
      dirLight.shadow.camera.right = 150;
      dirLight.shadow.camera.top = 100;
      dirLight.shadow.camera.bottom = -50;
      scene.add(dirLight);

      const rimLight = new THREE.DirectionalLight(0x3388ff, 0.6);
      rimLight.position.set(-50, 20, -50);
      scene.add(rimLight);

      // Materials Init
      redMat = new THREE.MeshStandardMaterial({ color: 0xcc1100, roughness: 0.3 });
      blueMat = new THREE.MeshStandardMaterial({ color: 0x002288, roughness: 0.4 });

      // Ground Physics
      const groundShape = new CANNON.Plane();
      const groundBody = new CANNON.Body({ mass: 0 });
      groundBody.addShape(groundShape);
      groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
      groundBody.position.set(0, -2, 0);
      world.addBody(groundBody);

      // Visual Ground (Street)
      const streetGeo = new THREE.PlaneGeometry(3000, 100);
      const streetMat = new THREE.MeshStandardMaterial({ color: 0x0a0a10, roughness: 0.9 });
      const streetMesh = new THREE.Mesh(streetGeo, streetMat);
      streetMesh.rotation.x = -Math.PI / 2;
      streetMesh.position.set(1000, -2, 0);
      streetMesh.receiveShadow = true;
      scene.add(streetMesh);

      // Build Background Elements
      createMountains();
      createClouds();
      
      // Spawn Hero & Initial City
      createHero();
      spawnInitialCity();

      // Event Listeners
      window.addEventListener('resize', onWindowResize);
      window.addEventListener('pointerdown', onTap);
      restartBtn.addEventListener('click', resetGame);

      // Start Loop
      animate();
    }

    // --- SPIDER HERO CREATION ---
    function createHero() {
      heroGroup = new THREE.Group();
      heroGroup.renderOrder = 999;

      const radius = 0.7;
      heroBody = new CANNON.Body({
        mass: 5,
        shape: new CANNON.Sphere(radius),
        linearDamping: 0.0,
        angularDamping: 0.01
      });
      heroBody.position.set(0, 25, 0);
      world.addBody(heroBody);

      const applyForegroundMat = (material) => {
        const mat = material.clone();
        mat.depthTest = false;
        return mat;
      };

      const heroRedMat = applyForegroundMat(redMat);
      const heroBlueMat = applyForegroundMat(blueMat);

      // Torso Mesh
      const torsoGeo = new THREE.SphereGeometry(radius, 16, 16);
      const torsoMesh = new THREE.Mesh(torsoGeo, heroRedMat);
      torsoMesh.renderOrder = 999;
      heroGroup.add(torsoMesh);

      // Eyes
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false });
      const eyeGeo = new THREE.BoxGeometry(0.15, 0.1, 0.25);
      const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
      leftEye.position.set(0.4, 0.2, 0.25);
      leftEye.rotation.y = 0.2;
      leftEye.renderOrder = 999;
      
      const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
      rightEye.position.set(0.4, 0.2, -0.25);
      rightEye.rotation.y = -0.2;
      rightEye.renderOrder = 999;
      
      heroGroup.add(leftEye, rightEye);

      // Limbs
      const limbGeo = new THREE.CylinderGeometry(0.12, 0.1, 0.9);
      
      const lLeg = new THREE.Mesh(limbGeo, heroBlueMat);
      lLeg.position.set(0, -0.6, 0.3);
      lLeg.renderOrder = 999;
      heroGroup.add(lLeg);

      const rLeg = new THREE.Mesh(limbGeo, heroBlueMat);
      rLeg.position.set(0, -0.6, -0.3);
      rLeg.renderOrder = 999;
      heroGroup.add(rLeg);

      const lArm = new THREE.Mesh(limbGeo, heroRedMat);
      lArm.position.set(0, 0.2, 0.6);
      lArm.rotation.x = Math.PI / 4;
      lArm.renderOrder = 999;
      heroGroup.add(lArm);

      const rArm = new THREE.Mesh(limbGeo, heroRedMat);
      rArm.position.set(0, 0.2, -0.6);
      rArm.rotation.x = -Math.PI / 4;
      rArm.renderOrder = 999;
      heroGroup.add(rArm);

      heroLimbs = [lLeg, rLeg, lArm, rArm];

      scene.add(heroGroup);
    }

    // --- ENVIRONMENT PROCEDURAL GENERATION ---
    function createMountains() {
      const mountainGeo = new THREE.ConeGeometry(60, 80, 4);
      const mountainMat = new THREE.MeshLambertMaterial({ color: 0x120826, flatShading: true });
      
      for (let i = 0; i < 30; i++) {
        const m = new THREE.Mesh(mountainGeo, mountainMat);
        m.position.set((i - 5) * 80, 20, -100 - Math.random() * 50);
        m.scale.set(1 + Math.random(), 1 + Math.random()*0.8, 1);
        scene.add(m);
        mountains.push(m);
      }
    }

    function createClouds() {
      const cloudGeo = new THREE.DodecahedronGeometry(10, 1);
      const cloudMat = new THREE.MeshLambertMaterial({ color: 0x3d2b56, transparent: true, opacity: 0.6 });

      for (let i = 0; i < 25; i++) {
        const cloud = new THREE.Group();
        const count = 3 + Math.floor(Math.random() * 4);
        for(let j = 0; j < count; j++) {
          const part = new THREE.Mesh(cloudGeo, cloudMat);
          part.position.set(j * 6, Math.random() * 3, Math.random() * 6);
          part.scale.setScalar(0.5 + Math.random() * 0.8);
          cloud.add(part);
        }
        cloud.position.set((i - 5) * 70, 40 + Math.random() * 30, -30 - Math.random() * 40);
        scene.add(cloud);
        clouds.push(cloud);
      }
    }

    let lastBuildingX = 10;

    function spawnBuilding(xPos) {
      const width = 10 + Math.random() * 12;
      const depth = 15 + Math.random() * 10;
      const height = 35 + Math.random() * 65;

      const geo = new THREE.BoxGeometry(width, height, depth);
      const mat = new THREE.MeshStandardMaterial({
        color: new THREE.Color().setHSL(0.6 + Math.random() * 0.1, 0.2, 0.15 + Math.random() * 0.1),
        roughness: 0.2,
        metalness: 0.5
      });

      const building = new THREE.Mesh(geo, mat);
      building.position.set(xPos, height / 2 - 2, -2);
      building.castShadow = true;
      building.receiveShadow = true;

      const windowGeo = new THREE.PlaneGeometry(width - 1, height - 2);
      const windowMat = new THREE.MeshBasicMaterial({
        color: 0xffdd88,
        wireframe: true,
        transparent: true,
        opacity: 0.15
      });
      const windowMesh = new THREE.Mesh(windowGeo, windowMat);
      windowMesh.position.set(0, 0, depth / 2 + 0.05);
      building.add(windowMesh);

      scene.add(building);

      building.userData = { width: width, height: height, xPos: xPos };
      buildings.push(building);
    }

    function getNextBuildingGap() {
      return 15 + Math.random() * 40;
    }

    function spawnInitialCity() {
      for (let i = 0; i < 15; i++) {
        spawnBuilding(lastBuildingX);
        lastBuildingX += getNextBuildingGap();
      }
    }

    function updateCity() {
      if (heroBody.position.x + 200 > lastBuildingX) {
        spawnBuilding(lastBuildingX);
        lastBuildingX += getNextBuildingGap();
      }

      for (let i = buildings.length - 1; i >= 0; i--) {
        const b = buildings[i];
        if (b.position.x < heroBody.position.x - 100) {
          scene.remove(b);
          buildings.splice(i, 1);
        }
      }

      mountains.forEach(m => {
        if (m.position.x < heroBody.position.x - 200) {
          m.position.x += 1200;
        }
      });
      clouds.forEach(c => {
        if (c.position.x < heroBody.position.x - 200) {
          c.position.x += 1000;
        }
      });
    }

    // --- SWING MECHANICS & INPUT ---
    function onTap(e) {
      if (isGameOver) return;
      if (instructionsEl.style.display !== 'none') instructionsEl.style.display = 'none';

      // Tap to detach if web is currently attached
      if (isAttached) {
        detachWeb();
        return;
      }

      // Tap to attach: Must hit a building mesh directly
      const touch = e.touches ? e.touches[0] : e;
      const mouse = new THREE.Vector2(
        (touch.clientX / window.innerWidth) * 2 - 1,
        -(touch.clientY / window.innerHeight) * 2 + 1
      );

      const raycaster = new THREE.Raycaster();
      raycaster.setFromCamera(mouse, camera);

      // Perform strict ray intersect check against all active buildings
      const intersects = raycaster.intersectObjects(buildings);

      if (intersects.length > 0) {
        // Attach web at exact 3D point tapped on the building surface
        attachWeb(intersects[0].point);
      }
    }

    function attachWeb(targetPoint) {
      detachWeb();

      anchorBody = new CANNON.Body({
        mass: 0,
        position: new CANNON.Vec3(targetPoint.x, targetPoint.y, targetPoint.z)
      });
      world.addBody(anchorBody);

      const p1 = new CANNON.Vec3(heroBody.position.x, heroBody.position.y, heroBody.position.z);
      const p2 = anchorBody.position;
      const ropeLength = p1.distanceTo(p2);

      activeConstraint = new CANNON.DistanceConstraint(heroBody, anchorBody, ropeLength);
      world.addConstraint(activeConstraint);
      isAttached = true;

      // Momentum launch
      const boostX = Math.max(heroBody.velocity.x * 0.25, 20);
      heroBody.applyImpulse(new CANNON.Vec3(boostX, 12, 0), heroBody.position);

      createWebVisual(targetPoint);
    }

    function detachWeb() {
      if (activeConstraint) {
        world.removeConstraint(activeConstraint);
        activeConstraint = null;
      }
      if (anchorBody) {
        world.removeBody(anchorBody);
        anchorBody = null;
      }
      if (webAnchorMesh) {
        scene.remove(webAnchorMesh);
        webAnchorMesh = null;
      }
      if (webGroup) {
        scene.remove(webGroup);
        webGroup = null;
        webCoreMesh = null;
        webOutlineMesh = null;
      }
      isAttached = false;
    }

    function createWebVisual(targetPoint) {
      if (webAnchorMesh) scene.remove(webAnchorMesh);
      if (webGroup) scene.remove(webGroup);

      // High contrast black & white anchor node at exact contact point
      const anchorGeo = new THREE.SphereGeometry(0.35, 12, 12);
      const anchorMat = new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false });
      webAnchorMesh = new THREE.Mesh(anchorGeo, anchorMat);
      webAnchorMesh.position.copy(targetPoint);
      webAnchorMesh.renderOrder = 999999;
      scene.add(webAnchorMesh);

      // Combined black & white web line for high-contrast visibility
      webGroup = new THREE.Group();

      // Thinner inner white core
      const coreGeo = new THREE.CylinderGeometry(0.035, 0.035, 1, 8);
      const coreMat = new THREE.MeshBasicMaterial({ 
        color: 0xffffff, 
        depthTest: false
      });
      webCoreMesh = new THREE.Mesh(coreGeo, coreMat);
      webCoreMesh.renderOrder = 999999;

      // Black outer outline sheath
      const outlineGeo = new THREE.CylinderGeometry(0.07, 0.07, 1, 8);
      const outlineMat = new THREE.MeshBasicMaterial({ 
        color: 0x000000, 
        depthTest: false
      });
      webOutlineMesh = new THREE.Mesh(outlineGeo, outlineMat);
      webOutlineMesh.renderOrder = 999998;

      webGroup.add(webOutlineMesh);
      webGroup.add(webCoreMesh);

      scene.add(webGroup);
    }

    function updateWebVisual() {
      if (!isAttached || !webAnchorMesh || !webGroup) return;

      const p1 = new THREE.Vector3(heroBody.position.x, heroBody.position.y, heroBody.position.z);
      const p2 = webAnchorMesh.position;

      const dist = p1.distanceTo(p2);
      const midPoint = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);

      webGroup.position.copy(midPoint);
      webCoreMesh.scale.set(1, dist, 1);
      webOutlineMesh.scale.set(1, dist, 1);

      // Orient cylinder along rope vector
      const direction = new THREE.Vector3().subVectors(p2, p1).normalize();
      const axis = new THREE.Vector3(0, 1, 0);
      webGroup.quaternion.setFromUnitVectors(axis, direction);
    }

    // --- RAGDOLL POP APART ON CRASH ---
    function triggerDisassembly() {
      if (isGameOver) return;
      isGameOver = true;
      detachWeb();

      heroGroup.children.forEach(mesh => {
        const worldPos = new THREE.Vector3();
        mesh.getWorldPosition(worldPos);

        scene.remove(mesh);

        const pieceBody = new CANNON.Body({
          mass: 1,
          shape: new CANNON.Box(new CANNON.Vec3(0.3, 0.3, 0.3)),
          linearDamping: 0.1
        });
        pieceBody.position.copy(worldPos);
        
        pieceBody.velocity.set(
          (Math.random() - 0.5) * 15,
          Math.random() * 15 + 5,
          (Math.random() - 0.5) * 15
        );
        pieceBody.angularVelocity.set(
          Math.random() * 10,
          Math.random() * 10,
          Math.random() * 10
        );

        world.addBody(pieceBody);

        const newMesh = mesh.clone();
        newMesh.renderOrder = 9999;
        scene.add(newMesh);
        limbBodies.push({ mesh: newMesh, body: pieceBody });
      });

      heroGroup.visible = false;

      setTimeout(() => {
        finalScoreEl.innerText = Math.max(0, Math.floor(distance));
        gameOverEl.style.display = 'block';
      }, 800);
    }

    // --- RESET GAME ---
    function resetGame() {
      limbBodies.forEach(item => {
        scene.remove(item.mesh);
        world.remove(item.body);
      });
      limbBodies = [];

      buildings.forEach(b => {
        scene.remove(b);
      });
      buildings = [];
      lastBuildingX = 10;

      detachWeb();

      heroBody.position.set(0, 25, 0);
      heroBody.velocity.set(0, 0, 0);
      heroBody.angularVelocity.set(0, 0, 0);
      heroGroup.visible = true;

      isGameOver = false;
      distance = 0;
      scoreEl.innerText = '0';
      gameOverEl.style.display = 'none';

      spawnInitialCity();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // --- MAIN ANIMATION LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      world.step(1 / 60);

      if (!isGameOver) {
        heroGroup.position.copy(heroBody.position);

        heroBody.position.z = 2;
        heroBody.velocity.z = 0;

        if (isAttached) {
          legSwingAngle += 0.3;
          heroLimbs[0].rotation.x = Math.sin(legSwingAngle) * 0.9;
          heroLimbs[1].rotation.x = -Math.sin(legSwingAngle) * 0.9;
          
          const angle = Math.atan2(heroBody.velocity.y, heroBody.velocity.x);
          heroGroup.rotation.z = angle * 0.4;

          // MOMENTUM BOOST: Pump forces during swing to maximize height and velocity
          if (anchorBody) {
            const dy = heroBody.position.y - anchorBody.position.y;
            if (heroBody.velocity.x > 0) {
              heroBody.velocity.x += 0.3; 
              if (dy < 0) heroBody.velocity.y += 0.2;
            }
          }
        } else {
          heroGroup.rotation.z = Math.min(Math.max(heroBody.velocity.y * 0.03, -0.8), 0.8);
          heroLimbs[0].rotation.x = 0.2;
          heroLimbs[1].rotation.x = -0.2;
        }

        distance = Math.max(distance, heroBody.position.x);
        scoreEl.innerText = Math.floor(distance);

        updateWebVisual();

        // Ground collision check
        if (heroBody.position.y <= 0.8) {
          triggerDisassembly();
        }

        updateCity();

        // Dynamic Camera follow
        const camTargetY = Math.max(heroBody.position.y + 4, 12);
        camera.position.x = THREE.MathUtils.lerp(camera.position.x, heroBody.position.x + 10, 0.08);
        camera.position.y = THREE.MathUtils.lerp(camera.position.y, camTargetY, 0.08);
        camera.position.z = THREE.MathUtils.lerp(camera.position.z, Math.max(35, heroBody.position.y * 0.8), 0.05);
        camera.lookAt(heroBody.position.x + 5, heroBody.position.y, 0);

      } else {
        limbBodies.forEach(item => {
          item.mesh.position.copy(item.body.position);
          item.mesh.quaternion.copy(item.body.quaternion);
        });
      }

      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
</html>
